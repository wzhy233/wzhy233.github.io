<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/img/icon.ico" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/img/icon2.ico" media="(prefers-color-scheme: light)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastebin - Chloride Technology</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS路径：当前目录下的css文件夹 -->
    <link rel="stylesheet" href="/pastebin/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="navbar-content">
                <!-- 首页链接：当前目录（pastebin/） -->
                <a href="./" class="logo">
                    <span class="logo-text">Pastebin</span>
                    <span class="logo-subtext">Chloride Technology</span>
                </a>
                <nav class="nav-links">
                    <!-- 所有导航链接基于pastebin目录 -->
                    <a href="./" class="nav-link" data-route="/">Home</a>
                    <a href="/pastebin/create/" class="nav-link" data-route="/create/">Create</a>
                    <a href="/pastebin/admin/" class="nav-link" data-route="/admin">Admin</a>
                    <a href="https://91net.top" class="nav-link" target="_blank">Chloride Tech</a>
                </nav>
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div id="routeContainer" class="route-container">
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; Copyright (c) Chloride Technology, All rights reserved.</p>
                <p><a href="https://91net.top" target="_blank">https://91net.top</a></p>
            </div>
        </div>
    </footer>

    <!-- 所有模板内容保持不变，但内部链接需要调整为基于pastebin目录 -->
    <template id="homeTemplate">
        <section class="page home-page">
            <div class="page-header">
                <h1>Recent Pastes</h1>
                <p>Discover and share code snippets and text</p>
                <!-- 创建页链接：当前目录下的create/ -->
                <a href="/pastebin/create/" class="btn primary-btn create-btn">
                    <i class="fas fa-plus"></i> Create New Paste
                </a>
            </div>
            
            <!-- 其余内容不变 -->
            <div class="paste-filters">
                <div class="filter-group">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="visibility">Visibility:</label>
                    <select id="visibility">
                        <option value="all">All</option>
                        <option value="public">Public</option>
                    </select>
                </div>
                <div class="search-box">
                    <input type="text" placeholder="Search pastes..." id="searchPastes">
                    <button class="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </div>
            
            <div class="paste-list" id="pasteList">
                <div class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Loading recent pastes...</p>
                </div>
            </div>
        </section>
    </template>

    <template id="createTemplate">
        <!-- 创建页内容不变，表单提交逻辑由JS处理 -->
        <section class="page create-page">
            <!-- 内容与之前一致 -->
        </section>
    </template>

    <template id="pasteTemplate">
        <section class="page paste-page">
            <!-- 其他内容不变，仅调整返回链接 -->
            <div class="paste-footer">
                <!-- 返回列表链接：指向pastebin目录的根页面 -->
                <a href="./" class="back-link">
                    <i class="fas fa-arrow-left"></i> Back to list
                </a>
                <div class="paste-id" id="pasteId"></div>
            </div>
        </section>
    </template>

    <template id="adminTemplate">
        <!-- 管理员页面内容不变 -->
        <section class="page admin-page">
            <!-- 内容与之前一致 -->
        </section>
    </template>

    <template id="notFoundTemplate">
        <section class="page not-found-page">
            <div class="not-found-content">
                <div class="error-code">404</div>
                <h1>Page Not Found</h1>
                <p>The page you're looking for doesn't exist or has been moved.</p>
                <!-- 返回首页链接：指向pastebin目录的根页面 -->
                <a href="./" class="btn primary-btn">
                    <i class="fas fa-home"></i> Return to Home
                </a>
            </div>
        </section>
    </template>

    <!-- JS路径：当前目录下的js文件夹 -->
    <script src="/pastebin/js/main.js"></script>
    <script src="/pastebin/js/api.js"></script>
    <script src="/pastebin/js/routes.js"></script>
    <script src="/pastebin/js/home.js"></script>
    <script src="/pastebin/js/create.js"></script>
    <script src="/pastebin/js/paste.js"></script>
    <script src="/pastebin/js/admin.js"></script>
</body>
</html>
