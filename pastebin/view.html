<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Paste - Chloride Technology</title>
    <link rel="icon" href="/img/icon.ico" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="/img/icon2.ico" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-clipboard" style="font-size: 1.5rem; color: var(--primary);"></i>
                <span class="logo-text">Pastebin - Chloride Technology</span>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="create.html">Create Paste</a></li>
                    <li><a href="admin.html">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="password-form" class="card" style="display: none; max-width: 500px; margin: 20px auto;">
            <div class="card-header">
                <h2>Private Paste</h2>
            </div>
            <div class="card-body">
                <p>This is a private paste. Please enter the password to view it.</p>
                <form>
                    <div class="form-group">
                        <label for="paste-password">Password</label>
                        <input type="password" id="paste-password" required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Unlock Paste</button>
                        <a href="index.html" class="btn btn-secondary" style="margin-left: 10px;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div id="paste-container">
            <!-- Paste content will be loaded here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
