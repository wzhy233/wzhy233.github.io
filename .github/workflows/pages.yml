name: Personal homepage

on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'config/**'
      - 'github/**'
      - 'data/**'
      - 'package.json'
      - 'scripts/update-public-data.py'
      - 'scripts/prepare-pages.py'
      - 'scripts/test_public_data.py'
      - 'scripts/github-pages.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test public data collector
        run: python -m unittest discover -s scripts -p test_public_data.py
      - name: Check frontend and translations
        run: node --test scripts/github-pages.test.mjs
      - name: Read public account sources
        run: python scripts/update-public-data.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Package website and preserve legacy routes
        run: python scripts/prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public homepage
        id: deployment
        uses: actions/deploy-pages@v4
